<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>multiverse-os</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link id="hljsDark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/dist/styles/github-dark.min.css">
    <link id="hljsLight" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/dist/styles/github.min.css" disabled>
    <style>
      /* Dark is the default theme; data-theme="light" overrides below. */
      :root, :root[data-theme="dark"] {
        --bg: #000000;
        --panel: #0a0a0a;
        --panel2: #141414;
        --border: #2e2e2e;
        --me: #ffffff;
        --me-text: #000000;
        --andrew: #141414;
        --text: #f5f5f5;
        --muted: #9a9a9a;
        --ok: #ffffff;
        --warn: #bdbdbd;
        --err: #6e6e6e;
        --accent: #ffffff;
        --on-accent: #000000;
        --code-bg: #0d1117;
        --code-inline-bg: #1a1a1a;
        --logo: #ffffff;
      }
      :root[data-theme="light"] {
        --bg: #ffffff;
        --panel: #f6f6f7;
        --panel2: #ececee;
        --border: #d6d6da;
        --me: #1a1a1a;
        --me-text: #ffffff;
        --andrew: #ffffff;
        --text: #16181d;
        --muted: #6a6e76;
        --ok: #1a1a1a;
        --warn: #6a6e76;
        --err: #a0a0a8;
        --accent: #1a1a1a;
        --on-accent: #ffffff;
        --code-bg: #f6f8fa;
        --code-inline-bg: #eceef1;
        --logo: #000000;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      /* ---- Sidebar: list of variants ---- */
      #sidebar {
        width: 264px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }
      #sidebar h1 {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0;
        padding: 18px 18px 10px;
      }
      .variant {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 16px;
        cursor: pointer;
        border-left: 3px solid transparent;
      }
      .variant:hover { background: var(--panel2); }
      .variant.active { background: var(--panel2); border-left-color: var(--accent); }
      .variant img {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--panel2);
        flex-shrink: 0;
      }
      .variant .meta { min-width: 0; }
      .variant .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .variant .state { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .sdot.live { background: var(--ok); }
      .sdot.working { background: var(--warn); animation: pulse 1s infinite; }

      /* ---- Chat pane ---- */
      #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #chatHeader {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      #chatHeader img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
      #chatHeader .title { font-weight: 600; }
      #chatHeader .sub { color: var(--muted); font-size: 13px; }
      #clearHistory {
        margin-left: auto;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      #clearHistory:hover { color: var(--err, #e05); border-color: var(--err, #e05); }

      /* ---- Confirmation modal ---- */
      #modalOverlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      #modalOverlay.open { display: flex; }
      #modalDialog {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px 28px;
        width: 320px;
        max-width: 90vw;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #modalDialog h2 { margin: 0; font-size: 15px; font-weight: 700; }
      #modalDialog p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
      #modalActions { display: flex; gap: 10px; justify-content: flex-end; }
      #modalCancel {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 16px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #modalCancel:hover { border-color: var(--muted); }
      #modalConfirm {
        background: var(--err, #e05);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 7px 16px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      #modalConfirm:hover { opacity: 0.85; }

      #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
      #empty { margin: auto; color: var(--muted); text-align: center; }

      .row { display: flex; gap: 10px; align-items: flex-end; }
      .row.me { justify-content: flex-end; }
      .row img.av { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
      .bubble { max-width: 680px; padding: 10px 14px; border-radius: 14px; word-wrap: break-word; }
      .me .bubble { background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
      .andrew .bubble { background: var(--andrew); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .andrew .bubble p { margin: 0 0 8px; }
      .andrew .bubble p:last-child { margin-bottom: 0; }
      .andrew .bubble pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 8px 0; }
      .andrew .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
      .andrew .bubble :not(pre) > code { background: var(--code-inline-bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
      .andrew .bubble ul, .andrew .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
      .andrew .bubble li { margin: 2px 0; }
      .andrew .bubble h1, .andrew .bubble h2, .andrew .bubble h3 { margin: 8px 0 4px; font-weight: 600; }
      .andrew .bubble blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding-left: 12px; color: var(--muted); }
      .note { align-self: center; font-size: 13px; padding: 7px 13px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); }
      .note.done { color: var(--ok); border-color: var(--ok); }
      .note.blocked { color: var(--warn); border-color: var(--warn); }
      .note.error { color: var(--err); border-color: var(--err); }
      .note.input_request { color: var(--accent); border-color: var(--accent); }

      /* ---- Input request card ---- */
      .input-card {
        align-self: stretch;
        background: var(--panel);
        border: 1px solid var(--accent);
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .input-card-prompt { font-weight: 600; font-size: 14px; }
      .input-card-choices { display: flex; flex-wrap: wrap; gap: 8px; }
      .choice-btn {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 16px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .choice-btn:hover { border-color: var(--accent); color: var(--accent); }
      .input-card-text-row { display: flex; gap: 8px; }
      .input-card-text {
        flex: 1;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
        font: inherit;
        font-size: 13px;
      }
      .input-card-text:focus { outline: none; border-color: var(--accent); }
      .input-card button {
        background: var(--accent);
        color: var(--on-accent);
        border: none;
        border-radius: 8px;
        padding: 0 16px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
.cursor::after { content: "▍"; color: var(--muted); animation: pulse 1s infinite; }
      @keyframes pulse { 50% { opacity: 0.3; } }

      /* ---- Activity bar: live tool progress ---- */
      #activity {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 6px 20px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #activity.visible { display: flex; }
      #activity .spinner {
        width: 8px; height: 8px; border-radius: 50%;
        border: 1.5px solid var(--muted); border-top-color: var(--text);
        animation: spin 0.7s linear infinite; flex-shrink: 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      form { display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--border); }
      .compose { display: flex; gap: 10px; padding: 14px 20px; align-items: flex-end; }
      textarea {
        flex: 1; resize: none; background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: inherit; max-height: 160px;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      button { background: var(--accent); color: var(--on-accent); border: none; border-radius: 10px; padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer; align-self: flex-end; }
      button:disabled { opacity: 0.5; cursor: default; }
      #attachments { display: none; flex-wrap: wrap; gap: 6px; }
      .attachment {
        display: flex; align-items: center; gap: 6px;
        background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
        padding: 5px 10px; font-size: 12px; color: var(--muted); max-width: 100%;
      }
      .attachment-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .attachment-remove {
        background: none; border: none; padding: 0 0 0 2px; cursor: pointer;
        color: var(--muted); font-size: 16px; line-height: 1; border-radius: 4px; flex-shrink: 0;
      }
      .attachment-remove:hover { color: var(--text); }

      #attachBtn {
        background: transparent; color: var(--muted); border: 1px solid var(--border);
        border-radius: 10px; padding: 0 12px; height: 42px; flex-shrink: 0; font-size: 16px; line-height: 1;
      }
      #attachBtn:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
      #attachRow {
        display: none; flex-wrap: wrap; gap: 6px;
        padding: 10px 20px 0;
      }
      #attachRow.visible { display: flex; }
      .attach-pill {
        display: flex; align-items: center; gap: 5px;
        background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
        padding: 3px 8px; font-size: 12px; max-width: 220px;
      }
      .attach-pill .pill-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
      .attach-pill .pill-remove {
        background: transparent; color: var(--muted); border: none; border-radius: 0;
        padding: 0; font-size: 14px; line-height: 1; cursor: pointer; flex-shrink: 0;
        font-weight: 600;
      }
      .attach-pill .pill-remove:hover { color: var(--text); }

      /* ---- Brand header + theme toggle ---- */
      #brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 16px 14px;
        border-bottom: 1px solid var(--border);
      }
      #brand .logo { width: 26px; height: 26px; color: var(--logo); flex-shrink: 0; }
      #brand .logo svg { width: 100%; height: 100%; display: block; }
      #brand .wordmark { font-weight: 700; letter-spacing: -0.01em; font-size: 15px; }
      #brand .wordmark .dim { color: var(--muted); font-weight: 600; }
      #themeToggle {
        margin-left: auto;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #themeToggle:hover { color: var(--text); border-color: var(--muted); }
    </style>
    <script>
      // Theme: preference is "system" | "light" | "dark" (default "system"),
      // persisted in localStorage. We resolve it to a concrete light/dark and set
      // data-theme on <html> before first paint to avoid a flash. Runs in <head>.
      (function () {
        const KEY = "mv-theme";
        const ORDER = ["system", "light", "dark"];
        const mql = window.matchMedia("(prefers-color-scheme: dark)");

        function pref() {
          const p = localStorage.getItem(KEY);
          return ORDER.includes(p) ? p : "system";
        }
        function resolve(p) {
          return p === "system" ? (mql.matches ? "dark" : "light") : p;
        }
        function apply() {
          const p = pref();
          const theme = resolve(p);
          document.documentElement.setAttribute("data-theme", theme);
          const dark = document.getElementById("hljsDark");
          const light = document.getElementById("hljsLight");
          if (dark && light) { dark.disabled = theme !== "dark"; light.disabled = theme !== "light"; }
          const btn = document.getElementById("themeToggle");
          if (btn) btn.textContent = p[0].toUpperCase() + p.slice(1);
        }
        // Apply ASAP for the <html> attribute; re-apply once the DOM (button/links) exists.
        apply();
        document.addEventListener("DOMContentLoaded", () => {
          apply();
          const btn = document.getElementById("themeToggle");
          if (btn) btn.addEventListener("click", () => {
            const next = ORDER[(ORDER.indexOf(pref()) + 1) % ORDER.length];
            localStorage.setItem(KEY, next);
            apply();
          });
        });
        // When following the system and it changes, reflect it live.
        mql.addEventListener("change", () => { if (pref() === "system") apply(); });
      })();
    </script>
  </head>
  <body>
    <aside id="sidebar">
      <div id="brand">
        <span class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" role="img" aria-label="multiverse-os logo">
            <circle cx="256.00" cy="108.00" r="34" />
            <circle cx="324.78" cy="124.95" r="34" />
            <circle cx="377.80" cy="171.93" r="34" />
            <circle cx="402.92" cy="238.16" r="34" />
            <circle cx="394.38" cy="308.48" r="34" />
            <circle cx="354.14" cy="366.78" r="34" />
            <circle cx="291.42" cy="399.70" r="34" />
            <circle cx="220.58" cy="399.70" r="34" />
            <circle cx="157.86" cy="366.78" r="34" />
            <circle cx="117.62" cy="308.48" r="34" />
            <circle cx="109.08" cy="238.16" r="34" />
            <circle cx="134.20" cy="171.93" r="34" />
            <circle cx="187.22" cy="124.95" r="34" />
          </svg>
        </span>
        <span class="wordmark">multiverse<span class="dim">-os</span></span>
        <button id="themeToggle" type="button" title="Toggle theme (system / light / dark)" aria-label="Toggle theme"></button>
      </div>
      <h1>Variants</h1>
      <div id="variants"></div>
    </aside>

    <section id="chat">
      <div id="chatHeader">
        <img id="hAvatar" alt="" />
        <div>
          <div class="title" id="hName">Pick a variant</div>
          <div class="sub" id="hWorkdir"></div>
        </div>
        <button id="clearHistory" type="button" title="Clear chat history" aria-label="Clear chat history" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
      </div>

      <div id="log"><div id="empty">Select a variant on the left to start chatting.</div></div>

      <div id="activity"><div class="spinner"></div><span id="activityText"></span></div>

      <form id="form">
        <div id="attachRow"></div>
        <div class="compose">
          <input type="file" id="fileInput" style="display:none" multiple />
          <button type="button" id="attachBtn" title="Attach file" disabled>&#128206;</button>
          <textarea id="input" rows="1" placeholder="Give Andrew a task… (Enter to send, Shift+Enter for newline)" disabled></textarea>
          <button id="send" type="submit" disabled>Send</button>
        </div>
      </form>
    </section>

    <div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalDialog">
        <h2 id="modalTitle">Clear history?</h2>
        <p id="modalBody"></p>
        <div id="modalActions">
          <button id="modalCancel" type="button">Cancel</button>
          <button id="modalConfirm" type="button">Clear</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/dist/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script>
      if (window.marked && window.hljs) {
        marked.use({
          renderer: {
            code({ text, lang }) {
              if (lang && hljs.getLanguage(lang)) {
                return `<pre><code class="hljs language-${lang}">${hljs.highlight(text, { language: lang, ignoreIllegals: true }).value}</code></pre>`;
              }
              return `<pre><code class="hljs">${hljs.highlightAuto(text).value}</code></pre>`;
            }
          },
          gfm: true,
          breaks: true
        });
      }

      function renderMd(text) {
        if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text));
        const d = document.createElement("div");
        d.textContent = text;
        return d.innerHTML;
      }

      const $ = (id) => document.getElementById(id);
      const variantsEl = $("variants");
      const logEl = $("log");
      const form = $("form");
      const input = $("input");
      const sendBtn = $("send");
      const attachBtn = $("attachBtn");
      const fileInput = $("fileInput");
      const attachRow = $("attachRow");
      const activityEl = $("activity");
      const activityText = $("activityText");

      // Per-variant pending attachments: variantId -> [{name, path, size}]
      const pendingAttachments = {};

      function getAttachments() { return pendingAttachments[activeId] ?? []; }

      function renderAttachments() {
        const list = getAttachments();
        attachRow.innerHTML = "";
        attachRow.classList.toggle("visible", list.length > 0);
        list.forEach((a, i) => {
          const pill = document.createElement("div");
          pill.className = "attach-pill";
          const name = document.createElement("span");
          name.className = "pill-name";
          name.textContent = a.name;
          name.title = a.path;
          const rm = document.createElement("button");
          rm.type = "button";
          rm.className = "pill-remove";
          rm.textContent = "×";
          rm.title = "Remove";
          rm.addEventListener("click", () => {
            getAttachments().splice(i, 1);
            renderAttachments();
          });
          pill.appendChild(name);
          pill.appendChild(rm);
          attachRow.appendChild(pill);
        });
      }

      attachBtn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", async () => {
        const files = Array.from(fileInput.files ?? []);
        fileInput.value = "";
        if (!files.length || !activeId) return;

        for (const file of files) {
          const fd = new FormData();
          fd.append("file", file);
          try {
            const res = await fetch(`/upload?variant=${encodeURIComponent(activeId)}`, { method: "POST", body: fd });
            if (!res.ok) { console.error("upload failed", await res.text()); continue; }
            const data = await res.json();
            if (!pendingAttachments[activeId]) pendingAttachments[activeId] = [];
            pendingAttachments[activeId].push(data);
            renderAttachments();
          } catch (err) {
            console.error("upload error", err);
          }
        }
      });

      function updateActivity({ tool, summary }) {
        activityText.textContent = `${tool}: ${summary}`;
        activityEl.classList.add("visible");
      }

      function clearActivity() {
        activityEl.classList.remove("visible");
      }

      // One session object per variant: its socket, message history, and UI state.
      const sessions = {}; // id -> { meta, ws, status, working, lastProgress, messages: [{who, kind, text, avatar}], live, streaming }
      let activeId = null;

      function setSidebarState(id) {
        const s = sessions[id];
        const node = document.querySelector(`.variant[data-id="${id}"]`);
        if (!node || !s) return;
        const dot = node.querySelector(".sdot");
        dot.className = "sdot " + (s.working ? "working" : s.live ? "live" : "");
        node.querySelector(".state").lastChild.textContent =
          s.working ? "working…" : s.live ? "online" : "offline";
      }

      function renderLog() {
        const s = sessions[activeId];
        logEl.innerHTML = "";
        if (!s || (s.messages.length === 0 && !s.pendingInput)) {
          const e = document.createElement("div");
          e.id = "empty";
          e.textContent = "Say hi to " + (s ? s.meta.name : "Andrew") + " — give them a task.";
          logEl.appendChild(e);
          return;
        }
        for (const m of s.messages) appendNode(m);
        if (s.pendingInput) logEl.appendChild(buildInputCard(s));
        logEl.scrollTop = logEl.scrollHeight;
      }

      function appendNode(m) {
        if (m.kind === "note") {
          const n = document.createElement("div");
          n.className = "note " + m.noteKind;
          n.textContent = m.text;
          logEl.appendChild(n);
        } else {
          const row = document.createElement("div");
          row.className = "row " + m.who;
          if (m.who === "andrew") {
            const av = document.createElement("img");
            av.className = "av";
            av.src = m.avatar;
            row.appendChild(av);
          }
          const b = document.createElement("div");
          b.className = "bubble";
          if (m.who === "andrew") { b.innerHTML = renderMd(m.text); } else { b.textContent = m.text; }
          if (m.streaming) b.classList.add("cursor");
          row.appendChild(b);
          row.dataset.streaming = m.streaming ? "1" : "";
          logEl.appendChild(row);
        }
        logEl.scrollTop = logEl.scrollHeight;
      }

      function selectVariant(id) {
        activeId = id;
        document.querySelectorAll(".variant").forEach((n) => n.classList.toggle("active", n.dataset.id === id));
        const s = sessions[id];
        $("hAvatar").src = s.meta.avatar;
        $("hName").textContent = s.meta.name;
        $("hWorkdir").textContent = s.meta.workdir ? "working in: " + s.meta.workdir : "";
        input.disabled = false;
        attachBtn.disabled = false;
        sendBtn.disabled = !s.live;
        clearBtn.disabled = false;
        if (s.working && s.lastProgress) updateActivity(s.lastProgress);
        else clearActivity();
        clearAttachments();
        input.focus();
        renderLog();
        renderAttachments();
      }

      function connect(meta) {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        const ws = new WebSocket(`${proto}://${location.host}/ws?variant=${encodeURIComponent(meta.id)}`);
        const s = sessions[meta.id];
        s.ws = ws;

        ws.onopen = () => { s.live = true; if (activeId === meta.id) sendBtn.disabled = false; setSidebarState(meta.id); };
        ws.onclose = () => { s.live = false; s.working = false; s.streaming = null; setSidebarState(meta.id); if (activeId === meta.id) sendBtn.disabled = true; };
        ws.onerror = () => { s.live = false; setSidebarState(meta.id); };

        ws.onmessage = (ev) => {
          const e = JSON.parse(ev.data);
          if (e.kind === "meta") {
            // enrich stored meta (workdir, etc.) on first message
            s.meta = { ...s.meta, ...e };
            if (activeId === meta.id) selectVariant(meta.id);
            return;
          }
          if (e.kind === "history") {
            s.messages = e.messages.map((m) => {
              if (m.role === "user") return { who: "me", text: m.text };
              if (m.role === "assistant") return { who: "andrew", text: m.text, avatar: s.meta.avatar };
              return { kind: "note", noteKind: m.noteKind, text: m.text };
            });
            if (activeId === meta.id) renderLog();
            return;
          }
          if (e.kind === "text") {
            if (!s.streaming) {
              s.streaming = { who: "andrew", text: "", avatar: s.meta.avatar, streaming: true };
              s.messages.push(s.streaming);
              if (activeId === meta.id) { if (s.messages.length === 1) renderLog(); else appendNode(s.streaming); }
            }
            s.streaming.text += e.text;
            if (activeId === meta.id) {
              const rows = logEl.querySelectorAll(".row.andrew");
              const last = rows[rows.length - 1];
              if (last) { last.querySelector(".bubble").innerHTML = renderMd(s.streaming.text); logEl.scrollTop = logEl.scrollHeight; }
            }
            return;
          }
          if (e.kind === "progress") {
            // Seal the current streaming bubble so the next text chunk opens a fresh one.
            if (s.streaming) {
              s.streaming.streaming = false;
              s.streaming = null;
              if (activeId === meta.id) {
                const rows = logEl.querySelectorAll(".row.andrew");
                const last = rows[rows.length - 1];
                if (last) last.querySelector(".bubble").classList.remove("cursor");
              }
            }
            s.lastProgress = { tool: e.tool, summary: e.summary };
            if (activeId === meta.id) updateActivity(s.lastProgress);
            return;
          }
          if (e.kind === "turn_end") {
            if (s.streaming) { s.streaming.streaming = false; s.streaming = null; }
            s.working = false; s.lastProgress = null; setSidebarState(meta.id);
            if (activeId === meta.id) { clearActivity(); renderLog(); sendBtn.disabled = !s.live; }
            notify(s.meta.name, "Done thinking.", s.meta.avatar, meta.id);
            return;
          }
          if (e.kind === "input_request") {
            s.pendingInput = { prompt: e.prompt, expected: e.expected, options: e.options };
            return;
          }
          if (e.kind === "done" || e.kind === "blocked" || e.kind === "error") {
            const text = e.kind === "done" ? "✅ " + e.summary
                       : e.kind === "blocked" ? "⚠️ blocked: " + e.question
                       : "❌ " + e.error;
            s.messages.push({ kind: "note", noteKind: e.kind, text });
            if (e.kind === "error") s.working = false;
            setSidebarState(meta.id);
            if (activeId === meta.id) { appendNode({ kind: "note", noteKind: e.kind, text }); if (e.kind === "error") sendBtn.disabled = !s.live; }
            const notifBody = e.kind === "done" ? e.summary : e.kind === "blocked" ? e.question : e.error;
            notify(s.meta.name + (e.kind === "blocked" ? " needs input" : e.kind === "error" ? " errored" : " finished"), notifBody, s.meta.avatar, meta.id);
          }
        };
      }

      function buildInputCard(s) {
        const card = document.createElement("div");
        card.className = "input-card";

        const prompt = document.createElement("div");
        prompt.className = "input-card-prompt";
        prompt.textContent = s.pendingInput.prompt;
        card.appendChild(prompt);

        if (s.pendingInput.expected === "choice") {
          const choices = document.createElement("div");
          choices.className = "input-card-choices";
          for (const opt of (s.pendingInput.options ?? [])) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "choice-btn";
            btn.textContent = opt;
            btn.addEventListener("click", () => submitInputResponse(s, opt));
            choices.appendChild(btn);
          }
          card.appendChild(choices);
        } else {
          const row = document.createElement("div");
          row.className = "input-card-text-row";
          const textInput = document.createElement("input");
          textInput.type = "text";
          textInput.className = "input-card-text";
          textInput.placeholder = "Type your answer…";
          const submitBtn = document.createElement("button");
          submitBtn.type = "button";
          submitBtn.textContent = "Submit";
          submitBtn.addEventListener("click", () => {
            const val = textInput.value.trim();
            if (val) submitInputResponse(s, val);
          });
          textInput.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") { const val = textInput.value.trim(); if (val) submitInputResponse(s, val); }
          });
          row.appendChild(textInput);
          row.appendChild(submitBtn);
          card.appendChild(row);
          setTimeout(() => textInput.focus(), 50);
        }
        return card;
      }

      function submitInputResponse(s, response) {
        if (!s.ws || s.ws.readyState !== WebSocket.OPEN) return;
        s.pendingInput = null;
        s.messages.push({ who: "me", text: response });
        s.working = true;
        setSidebarState(s.meta.id);
        sendBtn.disabled = true;
        s.ws.send(JSON.stringify({ kind: "input_response", response }));
        if (activeId === s.meta.id) renderLog();
      }

      // ---- Large-paste attachment handling ----
      const PASTE_CHARS = 500;
      const PASTE_LINES = 5;
      let attachedPastes = [];
      const attachmentsEl = $("attachments");

      function addAttachment(text) {
        const id = Date.now().toString();
        attachedPastes.push({ id, text });
        const lines = (text.match(/\n/g) || []).length + 1;
        const label = `📄 Pasted text · ${text.length.toLocaleString()} chars, ${lines} line${lines === 1 ? "" : "s"}`;
        const chip = document.createElement("div");
        chip.className = "attachment";
        chip.dataset.id = id;
        const labelSpan = document.createElement("span");
        labelSpan.className = "attachment-label";
        labelSpan.textContent = label;
        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "attachment-remove";
        removeBtn.textContent = "×";
        removeBtn.addEventListener("click", () => removeAttachment(id));
        chip.appendChild(labelSpan);
        chip.appendChild(removeBtn);
        attachmentsEl.appendChild(chip);
        attachmentsEl.style.display = "flex";
      }

      function removeAttachment(id) {
        attachedPastes = attachedPastes.filter((a) => a.id !== id);
        const chip = attachmentsEl.querySelector(`[data-id="${id}"]`);
        if (chip) chip.remove();
        if (attachmentsEl.children.length === 0) attachmentsEl.style.display = "none";
      }

      function clearAttachments() {
        attachedPastes = [];
        attachmentsEl.innerHTML = "";
        attachmentsEl.style.display = "none";
      }

      input.addEventListener("paste", (e) => {
        const text = e.clipboardData?.getData("text/plain") ?? "";
        const lineCount = (text.match(/\n/g) || []).length;
        if (text.length > PASTE_CHARS || lineCount >= PASTE_LINES) {
          e.preventDefault();
          addAttachment(text);
        }
      });
      // ---- End large-paste ----

      function submit() {
        const s = sessions[activeId];
        let text = input.value.trim();
        const attachments = getAttachments();
        if (!s || (!text && !attachments.length) || !s.live || s.ws.readyState !== WebSocket.OPEN) return;

        if (attachments.length > 0) {
          const fileList = attachments.map((a) => a.path).join("\n");
          const note = `[Attached files — available in your workdir:\n${fileList}]`;
          text = text ? note + "\n\n" + text : note;
          pendingAttachments[activeId] = [];
          renderAttachments();
        }

        s.messages.push({ who: "me", text });
        appendNode({ who: "me", text });
        s.ws.send(text);
        s.working = true;
        setSidebarState(activeId);
        sendBtn.disabled = true;
        input.value = "";
        input.style.height = "auto";
        clearAttachments();
      }

      form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
      input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
      input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });

      const clearBtn = $("clearHistory");
      const modalOverlay = $("modalOverlay");
      const modalBody = $("modalBody");
      const modalCancel = $("modalCancel");
      const modalConfirm = $("modalConfirm");

      function closeModal() { modalOverlay.classList.remove("open"); }

      clearBtn.addEventListener("click", () => {
        if (!activeId) return;
        const name = sessions[activeId]?.meta?.name ?? "this variant";
        modalBody.textContent = `This will permanently delete the chat history for ${name}. This can't be undone.`;
        modalOverlay.classList.add("open");
        modalCancel.focus();
      });

      modalCancel.addEventListener("click", closeModal);
      modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

      modalConfirm.addEventListener("click", async () => {
        closeModal();
        if (!activeId) return;
        await fetch(`/history/${activeId}`, { method: "DELETE" });
        const s = sessions[activeId];
        s.messages = [];
        s.streaming = null;
        s.working = false;
        s.lastProgress = null;
        // Close and reopen the socket so the server spins up a fresh Variant instance
        // with the now-empty history — without this the old context lives in the system prompt.
        s.ws.close();
        connect(s.meta);
        renderLog();
      });

      function notify(title, body, avatar, variantId) {
        if (document.visibilityState === "visible") return;
        if (Notification.permission !== "granted") return;
        const icon = avatar ? window.location.origin + avatar : undefined;
        try { new Notification(title, { body, icon, tag: variantId, silent: false }); } catch (_) {}
      }

      // Bootstrap: load the variant list, build the sidebar, open a socket per variant.
      if (Notification.permission === "default") Notification.requestPermission();

      fetch("/variants").then((r) => r.json()).then((list) => {
        list.forEach((v, i) => {
          sessions[v.id] = { meta: v, ws: null, working: false, lastProgress: null, live: false, streaming: null, messages: [], pendingInput: null };

          const node = document.createElement("div");
          node.className = "variant";
          node.dataset.id = v.id;
          node.innerHTML =
            `<img src="${v.avatar}" alt="${v.name}" />` +
            `<div class="meta"><div class="name">${v.name}</div>` +
            `<div class="state"><span class="sdot"></span><span>offline</span></div></div>`;
          node.addEventListener("click", () => selectVariant(v.id));
          variantsEl.appendChild(node);

          connect(v);
          if (i === 0) selectVariant(v.id);
        });
      });
    </script>
  </body>
</html>
