<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>multiverse-os</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link id="hljsDark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/dist/styles/github-dark.min.css">
    <link id="hljsLight" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/dist/styles/github.min.css" disabled>
    <link rel="stylesheet" href="/web/styles/theme.css" />
    <link rel="stylesheet" href="/web/styles/layout.css" />
    <link rel="stylesheet" href="/web/styles/components.css" />
    <script>
      // Theme: preference is "system" | "light" | "dark" (default "system"), persisted in
      // localStorage. Resolved to a concrete light/dark and set on <html> before first paint
      // to avoid a flash — which is why this stays an inline <head> script, not a module.
      (function () {
        const KEY = "mv-theme";
        const ORDER = ["system", "light", "dark"];
        const mql = window.matchMedia("(prefers-color-scheme: dark)");

        function pref() {
          const p = localStorage.getItem(KEY);
          return ORDER.includes(p) ? p : "system";
        }
        function resolve(p) {
          return p === "system" ? (mql.matches ? "dark" : "light") : p;
        }
        function apply() {
          const p = pref();
          const theme = resolve(p);
          document.documentElement.setAttribute("data-theme", theme);
          const dark = document.getElementById("hljsDark");
          const light = document.getElementById("hljsLight");
          if (dark && light) { dark.disabled = theme !== "dark"; light.disabled = theme !== "light"; }
          const btn = document.getElementById("themeToggle");
          if (btn) btn.textContent = p[0].toUpperCase() + p.slice(1);
        }
        // Apply ASAP for the <html> attribute; re-apply once the DOM (button/links) exists.
        apply();
        document.addEventListener("DOMContentLoaded", () => {
          apply();
          const btn = document.getElementById("themeToggle");
          if (btn) btn.addEventListener("click", () => {
            const next = ORDER[(ORDER.indexOf(pref()) + 1) % ORDER.length];
            localStorage.setItem(KEY, next);
            apply();
          });
        });
        // When following the system and it changes, reflect it live.
        mql.addEventListener("change", () => { if (pref() === "system") apply(); });
      })();
    </script>
  </head>
  <body>
    <aside id="sidebar">
      <div id="brand">
        <span class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" role="img" aria-label="multiverse-os logo">
            <circle cx="256.00" cy="108.00" r="34" />
            <circle cx="324.78" cy="124.95" r="34" />
            <circle cx="377.80" cy="171.93" r="34" />
            <circle cx="402.92" cy="238.16" r="34" />
            <circle cx="394.38" cy="308.48" r="34" />
            <circle cx="354.14" cy="366.78" r="34" />
            <circle cx="291.42" cy="399.70" r="34" />
            <circle cx="220.58" cy="399.70" r="34" />
            <circle cx="157.86" cy="366.78" r="34" />
            <circle cx="117.62" cy="308.48" r="34" />
            <circle cx="109.08" cy="238.16" r="34" />
            <circle cx="134.20" cy="171.93" r="34" />
            <circle cx="187.22" cy="124.95" r="34" />
          </svg>
        </span>
        <span class="wordmark">multiverse<span class="dim">-os</span></span>
        <button id="themeToggle" type="button" title="Toggle theme (system / light / dark)" aria-label="Toggle theme"></button>
      </div>
      <h1>Variants</h1>
      <div id="variants"></div>
      <div id="sidebarFooter">
        <button id="settingsBtn" type="button" title="Settings" aria-label="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </aside>

    <section id="chat">
      <div id="chatHeader">
        <img id="hAvatar" alt="" />
        <div>
          <div class="title" id="hName">Pick a variant</div>
          <div class="sub" id="hWorkdir"></div>
        </div>
        <button id="clearHistory" type="button" title="Clear chat history" aria-label="Clear chat history" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
      </div>

      <div id="log"><div id="empty">Select a variant on the left to start chatting.</div></div>

      <div id="activity"><div class="spinner"></div><span id="activityText"></span></div>

      <form id="form">
        <div id="attachRow"></div>
        <div id="attachments"></div>
        <div class="compose">
          <input type="file" id="fileInput" style="display:none" multiple />
          <button type="button" id="attachBtn" title="Attach file" disabled>&#128206;</button>
          <textarea id="input" rows="1" placeholder="Give Andrew a task… (Enter to send, Shift+Enter for newline)" disabled></textarea>
          <button id="send" type="submit" disabled>Send</button>
        </div>
      </form>
    </section>

    <div id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div id="settingsDialog">
        <div id="settingsHeader">
          <h2 id="settingsTitle">Settings</h2>
          <button id="settingsClose" type="button" aria-label="Close settings">✕</button>
        </div>
        <div class="settings-section">
          <h3>Notifications</h3>
          <p class="settings-desc" id="notifStatus"></p>
          <div class="settings-actions">
            <button id="requestNotifBtn" type="button">Enable Notifications</button>
            <button id="testNotifBtn" type="button" disabled>Test Notification</button>
          </div>
        </div>
      </div>
    </div>

    <div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalDialog">
        <h2 id="modalTitle">Clear history?</h2>
        <p id="modalBody"></p>
        <div id="modalActions">
          <button id="modalCancel" type="button">Cancel</button>
          <button id="modalConfirm" type="button">Clear</button>
        </div>
      </div>
    </div>

    <!-- Third-party rendering libs (classic scripts, run before the module entry). -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/dist/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <!-- App entry: a TS module graph transpiled on the fly by the server (see server.ts). -->
    <script type="module" src="/web/app.js"></script>
  </body>
</html>
